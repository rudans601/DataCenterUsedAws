service:
  type: ClusterIP
resources:
  requests: {cpu: 50m, memory: 128Mi}
persistence:
  enabled: false
testFramework:
  enabled: false
grafana.ini:
  security:
    allow_embedding: true
  server.custom_response_headers:
    Content-Security-Policy: "frame-ancestors 'self' http://127.0.0.1:8501 http://localhost:8501"
  auth.anonymous:
    enabled: true
    org_role: Viewer
  analytics:
    reporting_enabled: false
    check_for_updates: false
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/kubeops/demo-api.json
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: KubeOps Prometheus
        uid: kubeops-prom
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc:80
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubeops
        orgId: 1
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/kubeops
dashboardsConfigMaps:
  kubeops: kubeops-grafana-dashboard
