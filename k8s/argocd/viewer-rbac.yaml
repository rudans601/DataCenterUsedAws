apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeops-demo-viewer
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["kubeops-demo"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeops-demo-viewer
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeops-demo-viewer
subjects:
  - kind: ServiceAccount
    name: kubeops-copilot
    namespace: kubeops
